name: Nest API image

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nest-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/apiNestVerify.yml
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select image tags
        id: target
        shell: bash
        run: |
          imageRepository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shoplen-api-nest"
          echo "image=${imageRepository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          case "${GITHUB_REF}" in
            refs/heads/develop) echo "channelImage=${imageRepository}:dev" >> "$GITHUB_OUTPUT" ;;
            refs/heads/main) echo "channelImage=${imageRepository}:production" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build isolated Nest image
        uses: docker/build-push-action@v6
        with:
          context: apiNest
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.target.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify container health and shutdown
        env:
          API_NEST_IMAGE: ${{ steps.target.outputs.image }}
        run: bash .github/scripts/smokeNestImage.sh
      - name: Sign in to GHCR
        if: github.event_name == 'push' || inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image tags
        if: github.event_name == 'push' || inputs.publish
        env:
          API_NEST_IMAGE: ${{ steps.target.outputs.image }}
          API_NEST_CHANNEL_IMAGE: ${{ steps.target.outputs.channelImage }}
        run: |
          docker push "$API_NEST_IMAGE"
          echo "Published image: \`$API_NEST_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "$API_NEST_CHANNEL_IMAGE" ]]; then
            docker tag "$API_NEST_IMAGE" "$API_NEST_CHANNEL_IMAGE"
            docker push "$API_NEST_CHANNEL_IMAGE"
            echo "Portainer image: \`$API_NEST_CHANNEL_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          fi
