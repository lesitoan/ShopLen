name: Nest API verification

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - apiNest/**
      - .github/workflows/apiNestVerify.yml
      - .github/workflows/apiNestImage.yml
      - .github/scripts/smokeNestImage.sh
  push:
    branches: [main, develop, "codex/**", "toanls/**"]
    paths:
      - apiNest/**
      - .github/workflows/apiNestVerify.yml
      - .github/workflows/apiNestImage.yml
      - .github/scripts/smokeNestImage.sh

permissions:
  contents: read

concurrency:
  group: nest-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apiNest
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/shoplen_test
      REDIS_URL: redis://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apiNest/package-lock.json
      - name: Install Nest dependencies
        run: npm ci
      - name: Generate independent Prisma client
        run: npm run prisma:generate
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typeCheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
