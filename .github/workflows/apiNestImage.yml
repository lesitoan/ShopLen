name: Nest API image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nest-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/apiNestVerify.yml
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select immutable image
        id: target
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shoplen-api-nest:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build isolated Nest image
        uses: docker/build-push-action@v6
        with:
          context: apiNest
          load: true
          push: false
          tags: ${{ steps.target.outputs.image }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify container health and shutdown
        env:
          API_NEST_IMAGE: ${{ steps.target.outputs.image }}
        run: bash .github/scripts/smokeNestImage.sh
      - name: Sign in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified SHA image
        if: inputs.publish
        env:
          API_NEST_IMAGE: ${{ steps.target.outputs.image }}
        run: docker push "$API_NEST_IMAGE"
