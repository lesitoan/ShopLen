name: Nest API verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apiNest/**
      - api/**
      - .github/workflows/apiNestVerify.yml
  push:
    branches: [main, develop, "codex/**"]
    paths:
      - apiNest/**
      - api/**
      - .github/workflows/apiNestVerify.yml

permissions:
  contents: read

concurrency:
  group: nest-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apiNest
    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/shoplen_test
      REDIS_URL: redis://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            apiNest/package-lock.json
      - name: Install Nest dependencies
        run: npm ci
      - name: Install legacy contract reference
        run: npm --prefix ../api ci
      - name: Generate independent Prisma client
        run: npm run prisma:generate
      - name: Verify legacy source snapshot
        run: npm run contracts:check
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typeCheck
      - name: Build
        run: npm run build
      - name: Compiled HTTP and unit tests
        run: npm test
      - name: Development runtime tests
        run: npm run test:dev
