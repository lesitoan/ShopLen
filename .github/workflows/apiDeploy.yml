name: API CI and deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
    paths:
      - api/**
      - .github/workflows/apiDeploy.yml
      - .github/scripts/deployPortainerStack.sh
  push:
    branches: [develop, main]
    paths:
      - api/**

permissions:
  contents: read
  packages: write

concurrency:
  group: api-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type-check
        run: npm run typeCheck

      - name: Build
        run: npm run build

  publishAndDeploy:
    name: Publish image and deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Development' }}
    outputs:
      imageTag: ${{ steps.target.outputs.imageTag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select deployment target
        id: target
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "imageTag=production" >> "${GITHUB_OUTPUT}"
            echo "stackName=shoplen-v2" >> "${GITHUB_OUTPUT}"
            echo "healthUrl=http://127.0.0.1:5000/health" >> "${GITHUB_OUTPUT}"
          else
            echo "imageTag=dev" >> "${GITHUB_OUTPUT}"
            echo "stackName=shoplen-dev" >> "${GITHUB_OUTPUT}"
            echo "healthUrl=http://127.0.0.1:5001/health" >> "${GITHUB_OUTPUT}"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/lesitoan/shoplen-api:${{ steps.target.outputs.imageTag }}
            ghcr.io/lesitoan/shoplen-api:${{ github.sha }}

      - name: Open a private tunnel to Portainer
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "${VPS_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cp .github/ssh_known_hosts ~/.ssh/known_hosts
          ssh -f -N \
            -i ~/.ssh/deploy_key \
            -o ExitOnForwardFailure=yes \
            -L 127.0.0.1:19443:127.0.0.1:9443 \
            "${VPS_USER}@${VPS_HOST}"

      - name: Redeploy the Portainer stack
        env:
          API_IMAGE: ghcr.io/lesitoan/shoplen-api:${{ steps.target.outputs.imageTag }}
          PORTAINER_API_TOKEN: ${{ secrets.PORTAINER_API_TOKEN }}
          PORTAINER_STACK_NAME: ${{ steps.target.outputs.stackName }}
          PORTAINER_URL: https://127.0.0.1:19443
        run: bash .github/scripts/deployPortainerStack.sh

      - name: Verify deployed API health
        env:
          HEALTH_URL: ${{ steps.target.outputs.healthUrl }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            "for attempt in {1..12}; do curl --fail --silent --show-error \"${HEALTH_URL}\" && exit 0; sleep 5; done; exit 1"
