name: shoplen-nest-contract-tests

services:
  legacyPostgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: contract_test
      POSTGRES_PASSWORD: contract_test
      POSTGRES_DB: shoplen_contract_test
    ports:
      - "127.0.0.1:55441:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_test -d shoplen_contract_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  nestPostgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: contract_test
      POSTGRES_PASSWORD: contract_test
      POSTGRES_DB: shoplen_contract_test
    ports:
      - "127.0.0.1:55442:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_test -d shoplen_contract_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  legacyRedis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:56381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  nestRedis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:56382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
